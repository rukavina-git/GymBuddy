<!doctype html><html><head><meta charset="utf-8"><title>Active workout</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800&display=swap">
<style>
:root{--bg:#121418;--s1:#1C1F26;--s2:#262A33;--s3:#323743;--tx:#F3F4F6;--mu:#9AA1AD;--ol:#717886;--ac:#D4FF24;--onac:#121418;--ac2:#4D86F0;--acsoft:#2E3A1A}
*{box-sizing:border-box}body{margin:0;background:#0B0C0F;font-family:Figtree,sans-serif;padding:40px}
.phone{width:412px;height:915px;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;overflow:hidden}
.sb{display:flex;justify-content:space-between;padding:14px 24px 8px;font-size:14px;font-weight:600}
.top{display:flex;align-items:center;justify-content:space-between;height:60px;padding:0 8px 0 12px}
.tl{display:flex;align-items:center;gap:14px}.tl b{display:block;font-size:18px}.tl small{color:var(--mu);font-size:13px;font-weight:500}
.ib{width:48px;height:48px;display:grid;place-items:center}
.prog{display:flex;gap:4px;padding:0 20px}.prog i{flex:1;height:4px;border-radius:2px;background:var(--s2)}
.ex{padding:20px 20px 0;display:flex;flex-direction:column;gap:4px}.exr{display:flex;justify-content:space-between;align-items:center}
.ex h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.01em}.ex p{margin:0;color:var(--mu);font-size:15px;font-weight:500}
.how{display:flex;align-items:center;gap:6px;height:48px;padding:0 14px 0 12px;border-radius:24px;border:1.5px solid var(--ol);color:var(--mu);font-weight:600;font-size:13px}
.list{padding:20px 16px 0;display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:14px;height:52px;padding:0 16px 0 14px;border-radius:16px;background:var(--s1);font-weight:600;font-size:16px}
.row .l{color:var(--mu);font-size:15px;width:48px}
.ck{width:28px;height:28px;border-radius:14px;background:var(--acsoft);display:grid;place-items:center}
.ring{width:28px;height:28px;border-radius:14px;border:2px solid var(--ol)}
.next{background:transparent;border:1.5px solid var(--ol)}
.cur{background:var(--s1);border:2px solid var(--ac2);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:14px}
.ch{display:flex;justify-content:space-between;align-items:center}.ch b{font-size:17px}.ch span{color:var(--mu);font-size:14px;font-weight:500}
.steps{display:flex;gap:10px}.st{flex:1;background:var(--s2);border-radius:18px;padding:12px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:10px}
.v{font-size:40px;font-weight:800;line-height:44px;font-variant-numeric:tabular-nums}.v small{font-size:15px;color:var(--mu);font-weight:500;margin-left:4px}
.btns{display:flex;gap:10px}.btns span{width:56px;height:48px;border-radius:24px;background:var(--s3);display:grid;place-items:center}
.add{display:flex;justify-content:center;align-items:center;gap:6px;height:44px;color:var(--mu);font-weight:600;font-size:14px}
.grow{flex:1}.bot{padding:0 16px 20px;display:flex;flex-direction:column;gap:12px}
.up{display:flex;align-items:center;justify-content:space-between;height:48px;padding:0 12px 0 16px;border-radius:16px;border:1.5px solid var(--ol);font-size:14px;font-weight:600}.up span{color:var(--mu);margin-right:8px}
.cta{height:60px;border-radius:30px;background:var(--ac);color:var(--onac);display:flex;align-items:center;justify-content:center;gap:10px;font-weight:800;font-size:18px}
</style><script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script></head><body>
<div class="phone" id="active-workout">
<div class="sb"><span>9:41</span><span>●●●</span></div>
<div class="top"><div class="tl"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" fill="#F3F4F6"/></svg><div><b>Push A</b><small>38:12 · 3 of 6</small></div></div>
<div style="display:flex"><span class="ib"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z" fill="#F3F4F6"/></svg></span><span class="ib"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z" fill="#F3F4F6"/></svg></span></div></div>
<div class="prog"><i style="background:#9AA1AD;opacity:.6"></i><i style="background:#9AA1AD;opacity:.6"></i><i style="background:#D4FF24"></i><i></i><i></i><i></i></div>
<div class="ex"><div class="exr"><h1>Bench Press</h1><span class="how">ⓘ How to</span></div><p>Barbell · 4 sets × 8 reps</p></div>
<div class="list">
<div class="row"><span class="ck"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" fill="#D4FF24"/></svg></span><span class="l">Set 1</span>80 kg × 8</div>
<div class="row"><span class="ck"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" fill="#D4FF24"/></svg></span><span class="l">Set 2</span>80 kg × 8</div>
<div class="cur"><div class="ch"><b>Set 3</b><span>Last time 80 kg × 7</span></div><div class="steps">
<div class="st"><div class="v">82.5<small>kg</small></div><div class="btns"><span>−</span><span>+</span></div></div>
<div class="st"><div class="v">8<small>reps</small></div><div class="btns"><span>−</span><span>+</span></div></div></div></div>
<div class="row next"><span class="ring"></span><span class="l">Set 4</span>82.5 kg × 8</div>
<div class="add">+ Add set</div></div>
<div class="grow"></div>
<div class="bot"><div class="up"><div><span>Up next</span>Incline Dumbbell Press</div>›</div><div class="cta">✓ Done with set 3</div></div>
</div></body></html>
