# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Enables namespacing of each library's R class
android.nonTransitiveRClass=true

# Gradle warning mode
org.gradle.warning.mode=summary

# Allow KSP to use kotlin.sourceSets (temporary until KSP supports built-in Kotlin)
android.disallowKotlinSourceSets=false
# Downloads (Maven Central, plugin portal) retry with backoff: CI runners
# share IPs and get 429s. 4 tries, waits 1 s, 2 s, 4 s.
systemProp.org.gradle.internal.repository.max.tentatives=4
systemProp.org.gradle.internal.repository.initial.backoff=1000
