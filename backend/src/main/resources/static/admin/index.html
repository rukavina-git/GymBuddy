<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Gym Tracker admin</title>
  <link rel="stylesheet" href="admin.css">
  <script src="config.js"></script>
  <script type="module" src="admin.js"></script>
</head>
<body>
  <header class="bar">
    <span class="brand">Gym Tracker<span class="dot">.</span> admin</span>
    <nav><span class="section current">Feedback</span></nav>
    <button id="signOut" class="link" hidden>Sign out</button>
  </header>

  <main>
    <p id="status" class="status" role="status"></p>

    <section id="signedOut" hidden>
      <p class="muted">Sign in with an admin Google account.</p>
      <button id="signIn" class="primary">Sign in with Google</button>
    </section>

    <section id="feedback" hidden>
      <div id="chips" class="chips" role="tablist"></div>
      <ol id="list" class="list"></ol>
      <button id="more" class="secondary" hidden>Load more</button>
    </section>
  </main>
</body>
</html>
