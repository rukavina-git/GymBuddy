spring:
  application:
    name: gymbuddy-backend

  datasource:
    # The only way this app talks to Postgres. No separate host/port/db
    # properties anywhere - keeps the app portable across hosts. The
    # password is the one exception, split out below so it's never
    # embedded in a URL that could get logged or committed.
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/gymbuddy?user=gymbuddy}
    password: ${DB_PASSWORD:local}

  flyway:
    enabled: true

  jpa:
    open-in-view: false

  # Boot 3 (Jackson 2) behaviour, kept on purpose under Jackson 3: clients
  # lag behind releases, so unknown fields are ignored and an explicit null
  # for a number/boolean reads as 0/false instead of a 400.
  # SyncUnreadableBodyTest covers the unknown-field case.
  jackson:
    deserialization:
      fail-on-unknown-properties: false
      fail-on-null-for-primitives: false

# Plain text locally. On the VPS (docker/server/compose.yaml), LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs
# switches the console to one JSON object per line; MDC keys (traceId,
# userId, clientVersion, clientPlatform - see api/RequestMdcFilter.kt)
# become top-level fields.

springdoc:
  api-docs:
    path: /v3/api-docs
  # Must match the swagger-ui webjar pinned in build.gradle.kts; springdoc
  # otherwise serves its own built-in version's path and the page 500s.
  swagger-ui:
    version: 5.35.0

# FIREBASE_CREDENTIALS_B64 (base64-encoded service account JSON) is read
# directly via @Value in auth/FirebaseAdminConfig.kt, not through this
# block - see backend/README.md for how to supply it.
gymbuddy:
  rate-limit:
    capacity: ${RATE_LIMIT_CAPACITY:60}
    refill-per-minute: ${RATE_LIMIT_REFILL_PER_MINUTE:60}
  feedback:
    # POST /v1/feedback: messages per uid (or guest IP) per rolling hour.
    max-per-hour: ${FEEDBACK_MAX_PER_HOUR:5}
    # ntfy.sh topic for "New feedback" pushes (no user text). Blank = off.
    # A secret: set only in the server's .env, never committed.
    ntfy-topic: ${NTFY_FEEDBACK_TOPIC:}
  sync:
    # How long a tombstoned entity is kept before TombstoneRetentionService
    # hard-deletes it and its change_log rows (Group H). Configuration, not
    # a constant, specifically so tests can shorten it - see
    # TombstoneRetentionServiceTest.
    tombstone-retention-days: ${TOMBSTONE_RETENTION_DAYS:90}
    # When the daily retention job runs (TombstoneRetentionScheduler).
    # Standard cron, seconds-first (Spring's @Scheduled format).
    retention-cron: ${RETENTION_CRON:0 0 3 * * *}
    pull-page-size-default: ${PULL_PAGE_SIZE_DEFAULT:200}
    pull-page-size-max: ${PULL_PAGE_SIZE_MAX:500}
    # Safeguard: when true, POST /v1/sync/push rejects every request
    # with 503 without touching the database. Pull is unaffected. Flip
    # this on in production if sync misbehaves, to stop writes without
    # taking the whole service down.
    read-only: ${SYNC_READ_ONLY:false}
