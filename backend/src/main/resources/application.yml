spring:
  application:
    name: gymbuddy-backend

  datasource:
    # The only way this app talks to Postgres. No separate host/port/db
    # properties anywhere - keeps the app portable across hosts.
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/gymbuddy?user=gymbuddy&password=gymbuddy}

  flyway:
    enabled: true

  jpa:
    open-in-view: false

springdoc:
  api-docs:
    path: /v3/api-docs

# FIREBASE_CREDENTIALS_B64 (base64-encoded service account JSON) is read
# directly via @Value in auth/FirebaseAdminConfig.kt, not through this
# block - see backend/README.md for how to supply it.
gymbuddy:
  rate-limit:
    capacity: ${RATE_LIMIT_CAPACITY:60}
    refill-per-minute: ${RATE_LIMIT_REFILL_PER_MINUTE:60}
  sync:
    # Placeholder wired up in a later group (pull/retention - Group G).
    tombstone-retention-days: ${TOMBSTONE_RETENTION_DAYS:90}
    pull-page-size-default: ${PULL_PAGE_SIZE_DEFAULT:200}
    pull-page-size-max: ${PULL_PAGE_SIZE_MAX:500}
    # Safeguard: when true, POST /v1/sync/push rejects every request
    # with 503 without touching the database. Pull is unaffected. Flip
    # this on in production if sync misbehaves, to stop writes without
    # taking the whole service down.
    read-only: ${SYNC_READ_ONLY:false}
