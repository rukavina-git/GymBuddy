name: DB Backup

# Nightly encrypted dump of the prod database. The repo is public, so
# the dump is encrypted before it leaves the runner and only the .gpg
# file is uploaded. Restore: docker/README.md "Restore".
#
# Postgres on the VPS is not public, so pg_dump runs there via
# SSH + docker compose exec (ADR 0016). The DEPLOY_* secrets live in
# the `backup` environment (no reviewer, main only), so nightly runs
# don't wait for approval. Fails (red) when they are empty, so a
# missing secret can't skip backups silently.

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  vps:
    name: Dump and encrypt (VPS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: backup
    steps:
      - name: Dump database
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::error::DEPLOY_HOST, DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS must be set in the backup environment"
            exit 1
          fi
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::BACKUP_PASSPHRASE secret must be set"
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          file="gymbuddy-vps-$(date -u +%Y%m%dT%H%M%SZ).dump.gpg"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "deploy@$DEPLOY_HOST" \
            'cd /opt/gymbuddy && docker compose exec -T db pg_dump -Fc --no-owner -U gymbuddy gymbuddy' \
            | gpg --batch --yes --symmetric --cipher-algo AES256 \
                --pinentry-mode loopback \
                --passphrase-fd 3 3<<<"$BACKUP_PASSPHRASE" \
                --output "$file"
          test -s "$file"
          echo "BACKUP_FILE=$file" >> "$GITHUB_ENV"

      - name: Upload encrypted dump
        if: env.BACKUP_FILE != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_FILE }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30
          if-no-files-found: error
