name: (reusable) OWASP dependency-check

# Scans one module's dependencies for known CVEs and uploads the report.
# Not on the default push/PR path (see owasp.yml) - a scan still takes a
# few minutes on top of the checkout, on top of not wanting a third-party
# CVE feed's noise on every PR.
#
# Uses dependency-check/Dependency-Check_Action. Its Docker image
# (owasp/dependency-check-action) is rebuilt nightly by the
# dependency-check org with a fresh NVD/hosted-suppressions/RetireJS
# database baked in - see github.com/dependency-check/DependencyCheck_Builder,
# which does its own NVD sync (with its own API key) once for everyone,
# rather than every consumer of the action syncing separately. The
# action's entrypoint hardcodes --noupdate unconditionally - that isn't
# something this workflow's inputs can override, and it isn't a bug: the
# image is meant to be scanned against as shipped, not synced again on
# every run. Consequences that matter here:
#   - No NVD_API_KEY is needed or accepted by this workflow. Passing one
#     would be inert anyway, since --noupdate blocks any update
#     regardless of whether a key is present - and there is nowhere
#     correct to plug one in without fighting the action's own hardcoded
#     args (see below).
#   - Do NOT point --data at an external or cached directory. That
#     redirects dependency-check away from the image's baked-in database
#     to an empty one it can never populate (the update that would fill
#     it is the thing --noupdate blocks) - a scan that reports zero
#     vulnerabilities because it never had any data, not because there
#     were none. Let it use the image's own default data directory by
#     not passing --data at all.
#   - Freshness is bounded by that nightly build cadence: current as of
#     last night's build, not same-day. Confirmed the image was pushed
#     within the last 24h as of writing this - if that cadence ever
#     stalls (upstream pipeline goes quiet), this scan goes stale
#     silently, since a Docker pull of a tag that hasn't moved isn't a
#     failure. Worth an occasional manual spot-check of
#     hub.docker.com/r/owasp/dependency-check-action/tags if a scan ever
#     looks suspiciously clean.

on:
  workflow_call:
    inputs:
      module-path:
        description: "Directory of the module to scan, e.g. 'backend' or 'android'."
        required: true
        type: string

jobs:
  owasp:
    name: OWASP dependency-check (${{ inputs.module-path }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: gymbuddy-${{ inputs.module-path }}
          path: ${{ inputs.module-path }}
          # ALL, not "HTML,XML": the action passes this input through as
          # a single --format value verbatim, and the underlying CLI
          # takes --format multiple times (or ALL) for multiple formats,
          # not a comma-separated list - a comma-joined value is just one
          # invalid format name to it.
          format: 'ALL'

      # The action's own `out` input (default 'reports', not overridden
      # here) becomes --out /github/workspace/reports inside the
      # container. /github/workspace is a bind-mount of this job's
      # $GITHUB_WORKSPACE, and actions/upload-artifact resolves a
      # relative path against that same workspace root - so reports/
      # below and the container's /github/workspace/reports are the same
      # directory on disk.
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-report-${{ inputs.module-path }}
          path: reports/
          retention-days: 14
          if-no-files-found: error
