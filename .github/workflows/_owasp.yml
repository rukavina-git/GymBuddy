name: (reusable) OWASP dependency-check

# Scans one module's resolved Gradle dependency graph for known CVEs via
# the org.owasp:dependency-check-gradle plugin, applied directly in each
# module's own build file (see the `dependencyCheck { }` block in
# backend/build.gradle.kts and android/app/build.gradle.kts) - not the
# standalone dependency-check CLI action this used to call.
#
# The CLI action scanned the checked-out *source tree* for jar/aar files
# sitting on disk - correct for a pre-built artifact directory, useless
# for a Gradle project, where resolved dependencies live in
# ~/.gradle/caches, not the working directory. It reported "Dependencies
# Scanned: 1" for both modules because of this, not because either module
# genuinely has one dependency. The Gradle plugin runs inside the build
# and walks the actual resolved configuration, so it sees everything
# Gradle sees - confirmed locally via `./gradlew :app:dependencies`
# (android) and `./gradlew dependencies` (backend) against
# debugRuntimeClasspath/runtimeClasspath: 510 and 296 distinct resolved
# artifacts respectively, not 1.
#
# This also means a real NVD sync happens on every run now (autoUpdate
# defaults to true in both build files - deliberately left unset there
# rather than forced, since core's own freshness check already skips
# redundant re-downloads on a warm cache).
#
# NVD_API_KEY is REQUIRED, not just a speed optimization: verified
# locally that dependency-check-gradle 13.0.0 does not fall back to
# unauthenticated NVD access when no key is configured - it fails
# immediately ("Invalid API Key, length of 0") rather than doing a
# slower anonymous sync. Request a key at
# https://nvd.nist.gov/developers/request-an-api-key (free, near-
# instant), then add it as the NVD_API_KEY secret (repo or org level:
# Settings -> Secrets and variables -> Actions) before running this
# workflow - it cannot succeed without one.

on:
  workflow_call:
    inputs:
      module-path:
        description: "Directory of the module to scan, e.g. 'backend' or 'android'."
        required: true
        type: string
      java-version:
        description: "JDK version to run Gradle with."
        required: false
        type: string
        default: '21'
      gradle-task:
        description: "The dependencyCheckAnalyze task to run. Differs per module: android applies the plugin to :app (the only subproject with a real dependency graph), backend applies it at the root."
        required: false
        type: string
        default: 'dependencyCheckAnalyze'
      report-dir:
        description: "Directory the reports land in, relative to module-path. Defaults to the plugin's own default (build/reports); android overrides to app/build/reports since the plugin runs in :app there."
        required: false
        type: string
        default: 'build/reports'
      secret-file-path:
        description: "Optional path, relative to module-path, to write secret-file-content to before running (android's google-services.json - AGP's google-services plugin wants it present even just to configure the project). Leave empty to skip."
        required: false
        type: string
        default: ''
    secrets:
      NVD_API_KEY:
        required: false
      secret-file-content:
        required: false

jobs:
  owasp:
    name: OWASP dependency-check (${{ inputs.module-path }})
    runs-on: ubuntu-latest
    # Needed to publish the SARIF report to the repo's Security tab -
    # granted here for self-documentation, but it's the calling job's own
    # `permissions:` (see owasp.yml) that actually has to grant it, since
    # a reusable workflow can only narrow what its caller allows, never
    # widen it.
    permissions:
      contents: read
      security-events: write

    defaults:
      run:
        working-directory: ${{ inputs.module-path }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ inputs.java-version }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ inputs.java-version }}

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-owasp-${{ inputs.module-path }}-${{ hashFiles(format('{0}/**/*.gradle*', inputs.module-path)) }}
          restore-keys: |
            ${{ runner.os }}-gradle-owasp-${{ inputs.module-path }}-

      - name: Cache NVD database
        uses: actions/cache@v4
        with:
          # Must match the dependencyCheck { data.directory = ... } set
          # in this module's build file, or this cache silently caches
          # nothing dependency-check actually reads.
          path: ${{ inputs.module-path }}/dependency-check-data
          # No hashFiles input here on purpose: the NVD feed is external
          # and time-based, not a function of this repo's own files - a
          # fixed key plus restore-keys just reuses the most recent sync
          # and lets dependency-check's autoUpdate fetch the (small)
          # delta, rather than a cold full sync on every run.
          key: nvd-db-${{ inputs.module-path }}-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nvd-db-${{ inputs.module-path }}-${{ runner.os }}-

      - name: Write ${{ inputs.secret-file-path }} from secret
        if: inputs.secret-file-path != ''
        env:
          FILE_CONTENT: ${{ secrets.secret-file-content }}
        run: printf '%s' "$FILE_CONTENT" > "${{ inputs.secret-file-path }}"

      - name: OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./gradlew ${{ inputs.gradle-task }} --stacktrace

      - name: Upload SARIF to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ inputs.module-path }}/${{ inputs.report-dir }}/dependency-check-report.sarif
          category: dependency-check-${{ inputs.module-path }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-report-${{ inputs.module-path }}
          path: |
            ${{ inputs.module-path }}/${{ inputs.report-dir }}/dependency-check-report.html
            ${{ inputs.module-path }}/${{ inputs.report-dir }}/dependency-check-report.sarif
          retention-days: 14
          if-no-files-found: error
