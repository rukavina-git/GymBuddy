name: (reusable) Sonar analysis

# Scans one module and points Sonar at the JaCoCo report a prior
# _gradle-test.yml job already produced (downloaded by artifact name,
# not regenerated here - no second test run just to get coverage).
#
# rukavina-git is a SonarCloud organisation key (self-hosted SonarQube
# has no such concept), so this targets SonarCloud via the unified
# SonarSource scanner action, which defaults to sonarcloud.io once
# sonar.organization is set - no SONAR_HOST_URL needed unless that ever
# changes to a self-hosted instance.

on:
  workflow_call:
    inputs:
      module-path:
        description: "Directory of the module being analysed, e.g. 'backend'. Also the artifact-name suffix _gradle-test.yml uploaded the JaCoCo report under."
        required: true
        type: string
      sonar-project-key:
        required: true
        type: string
      sources-path:
        description: "sonar.sources, relative to module-path."
        required: false
        type: string
        default: 'src/main'
      tests-path:
        description: "sonar.tests, relative to module-path."
        required: false
        type: string
        default: 'src/test'
      coverage-report-dir:
        description: "Directory to download the JaCoCo report into, relative to the repo root and including the module path, e.g. 'backend/build/reports/jacoco/test'. Must be the same coverage-report-dir the _gradle-test.yml job for this module used, since the artifact name is derived from module-path and the two need to agree on where the report ends up."
        required: true
        type: string
      java-binaries-path:
        description: "sonar.java.binaries, relative to module-path."
        required: false
        type: string
        default: 'build/classes'
      coverage-exclusions:
        description: "sonar.coverage.exclusions: comma-separated patterns, relative to module-path, for files exempt from coverage expectations. These are still analysed for bugs/smells (sonar.exclusions, untouched, is the knob for skipping analysis entirely) - this only stops a file's lines from counting toward the coverage gate."
        required: false
        type: string
        default: ''
      cpd-exclusions:
        description: "sonar.cpd.exclusions: comma-separated patterns, relative to module-path, left out of duplication detection only (still analysed for bugs/smells). For generated data such as seed SQL migrations."
        required: false
        type: string
        default: ''
      extra-args:
        description: "Extra scanner args, space-separated -D flags (e.g. sonar.issue.ignore.multicriteria for rules that don't fit generated files)."
        required: false
        type: string
        default: ''
      wait-for-gate:
        description: "Wait for the SonarCloud quality gate and post a warning when it is red; the job stays green (Plan 8.2a, ADR 0013 update). Only true on pushes to develop: develop is SonarCloud's main branch, and the free plan cannot read the gate of any other branch."
        required: false
        type: boolean
        default: false
    secrets:
      SONAR_TOKEN:
        required: true

jobs:
  sonar:
    name: Sonar (${{ inputs.module-path }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Sonar's blame/new-code data needs real history - a shallow
          # checkout would attribute every line to the checkout commit.
          fetch-depth: 0

      - name: Download JaCoCo report
        uses: actions/download-artifact@v4
        with:
          name: jacoco-report-${{ inputs.module-path }}
          path: ${{ inputs.coverage-report-dir }}

      - name: Resolve coverage report path relative to module
        id: coverage
        env:
          COVERAGE_REPORT_DIR: ${{ inputs.coverage-report-dir }}
          MODULE_PATH: ${{ inputs.module-path }}
        run: echo "relative-dir=${COVERAGE_REPORT_DIR#"$MODULE_PATH"/}" >> "$GITHUB_OUTPUT"

      - name: SonarCloud scan
        id: scan
        uses: SonarSource/sonarqube-scan-action@v6
        # Gate is a warning, not a block (ADR 0013, 8.2a): a red gate
        # must not stop develop. The release check reads the gate
        # before any v* tag or main PR.
        continue-on-error: ${{ inputs.wait-for-gate }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: ${{ inputs.module-path }}
          args: >
            -Dsonar.organization=rukavina-git
            -Dsonar.projectKey=${{ inputs.sonar-project-key }}
            -Dsonar.sources=${{ inputs.sources-path }}
            -Dsonar.tests=${{ inputs.tests-path }}
            -Dsonar.coverage.jacoco.xmlReportPaths=${{ steps.coverage.outputs.relative-dir }}/jacocoTestReport.xml
            -Dsonar.java.binaries=${{ inputs.java-binaries-path }}
            -Dsonar.coverage.exclusions=${{ inputs.coverage-exclusions }}
            -Dsonar.cpd.exclusions=${{ inputs.cpd-exclusions }}
            ${{ inputs.extra-args }}
            -Dsonar.qualitygate.wait=${{ inputs.wait-for-gate }}
            -Dsonar.projectBaseDir=${{ inputs.module-path }}
          # qualitygate.wait=true fails the scan step on a red gate;
          # continue-on-error above turns that into the warning below.

      - name: Warn on red quality gate
        if: inputs.wait-for-gate && steps.scan.outcome == 'failure'
        env:
          PROJECT_KEY: ${{ inputs.sonar-project-key }}
        run: |
          msg="Sonar quality gate is red (or the scan failed) for ${PROJECT_KEY}. Not blocking develop; must be green before any v* tag or main PR."
          echo "::warning title=Sonar quality gate::${msg}"
          {
            echo "### :warning: Sonar quality gate red"
            echo "${msg}"
            echo "https://sonarcloud.io/summary/new_code?id=${PROJECT_KEY}"
          } >> "$GITHUB_STEP_SUMMARY"
