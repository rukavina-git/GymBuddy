name: Deploy backend

# Manual deploy of a GHCR image tag to the VPS (ADR 0016). Runs
# docker/server/deploy.sh over SSH as the deploy user; that script
# checks health and rolls back on failure. Auto-deploy: Plan 8.4.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag from the backend build, e.g. sha-abc1234"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to prod
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: prod
    steps:
      - name: Deploy over SSH
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::error::DEPLOY_HOST, DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS must be set (repo secrets)"
            exit 1
          fi
          # deploy.sh validates the full ref too; this keeps junk off the SSH command line.
          if ! [[ "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::bad image tag: $IMAGE_TAG"
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "deploy@$DEPLOY_HOST" \
            "/opt/gymbuddy/deploy.sh ghcr.io/rukavina-git/gymbuddy-backend:$IMAGE_TAG"
