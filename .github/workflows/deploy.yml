name: Deploy backend

# Deploys a GHCR image tag to the VPS (ADR 0016). Runs
# docker/server/deploy.sh over SSH as the deploy user; that script
# checks health and rolls back on failure. Called by backend-build.yml
# (develop push → test) and backend-release.yml (v* tag on main →
# prod, Plan 8.4); "Run workflow" stays the manual path and rollback.
# target picks the stack: prod in /opt/gymbuddy, test in
# /opt/gymbuddy-test (same box, same deploy key). DEPLOY_* are
# environment secrets: prod needs the owner's approval and runs only
# from main or a v* tag; test runs from develop or main.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Stack to deploy to"
        required: true
        type: choice
        options:
          - test
          - prod
        default: test
      image_tag:
        description: "Image tag from the backend build, e.g. sha-abc1234"
        required: true
        type: string
  workflow_call:
    inputs:
      target:
        description: "test or prod"
        required: true
        type: string
      image_tag:
        description: "Image tag from the backend build, e.g. sha-abc1234"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.target }}
    steps:
      - name: Deploy over SSH
        env:
          TARGET: ${{ inputs.target }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::error::DEPLOY_HOST, DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS must be set (environment secrets of $TARGET)"
            exit 1
          fi
          case "$TARGET" in
            prod) dir=/opt/gymbuddy ;;
            test) dir=/opt/gymbuddy-test ;;
            *) echo "::error::unknown target: $TARGET"; exit 1 ;;
          esac
          # deploy.sh validates the full ref too; this keeps junk off the SSH command line.
          if ! [[ "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::bad image tag: $IMAGE_TAG"
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "deploy@$DEPLOY_HOST" \
            "$dir/deploy.sh ghcr.io/rukavina-git/gymbuddy-backend:$IMAGE_TAG"
