name: Dependency graph

# Uploads the resolved Gradle dependency tree of what ships (direct and
# transitive) of android and backend to GitHub, so Dependabot alerts
# and the Security tab cover every library, from the GitHub Advisory
# Database. Replaces OWASP on every push: NVD's API kept returning 503
# (2026-11-15), so OWASP is now weekly + manual only.

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'android/**/*.gradle.kts'
      - 'android/gradle/**'
      - 'backend/**/*.gradle.kts'
      - 'backend/gradle/**'
      - '.github/workflows/dependency-graph.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: dependency-graph-${{ github.ref }}
  cancel-in-progress: true

jobs:
  submit:
    name: Submit ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Only what ships: the prod release app and the backend's
          # runtime. Gradle plugins, lint, Robolectric and other build or
          # test tools (buildscript `classpath`, test configs) stay out;
          # with them in, every plugin's transitive deps raised alerts
          # (bouncycastle, jdom2, handlebars...) that never reach users.
          - module: android
            java: '17'
            configurations: 'prodReleaseRuntimeClasspath'
          - module: backend
            java: '21'
            configurations: 'runtimeClasspath'
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      # The google-services plugin needs a config file to configure the
      # app; the qa one is enough to resolve dependencies.
      - name: Create google-services.json (qa)
        if: matrix.module == 'android'
        env:
          GOOGLE_SERVICES_JSON_QA: ${{ secrets.GOOGLE_SERVICES_JSON_QA }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON_QA" > app/src/qa/google-services.json

      - name: Submit dependency graph
        uses: gradle/actions/dependency-submission@v4
        env:
          DEPENDENCY_GRAPH_INCLUDE_CONFIGURATIONS: ${{ matrix.configurations }}
        with:
          build-root-directory: ${{ matrix.module }}
          dependency-graph-continue-on-failure: false
