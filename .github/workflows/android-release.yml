name: Android Release

# Plan 8.2 + 8.3. Branch rule: main is prod, develop is test (ADR 0017).
# A v* tag on a main commit builds the signed, minified prod AAB
# (versionName/versionCode from the tag, app/build.gradle.kts) and
# fastlane uploads it to the Play internal track. A tag not on main
# fails. "Run workflow" on a tag promotes internal → closed (alpha).
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Signed prod AAB
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Upload key + Play secrets live only here; the environment allows v* tags only.
    environment: release

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Environments can't restrict a tag to a branch, so check it here.
      - name: Tag must be on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main. Prod releases are tagged on main only."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-android-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-android-

      - name: Create google-services.json (prod)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p app/src/prod
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/src/prod/google-services.json

      # The keystore goes to the runner's temp dir; keystore.properties
      # must sit in android/ (read by app/build.gradle.kts). Both are
      # deleted in the cleanup step.
      - name: Write upload key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::ANDROID_UPLOAD_* secrets missing in the release environment"
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build signed prod AAB
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >
          ./gradlew bundleProdRelease --stacktrace
          -Pgymbuddy.releaseTag="$RELEASE_TAG"
          -Pgymbuddy.uploadMapping=true

      - name: Upload AAB and mapping
        uses: actions/upload-artifact@v4
        with:
          name: app-prod-release-${{ github.ref_name }}
          path: |
            android/app/build/outputs/bundle/prodRelease/app-prod-release.aab
            android/app/build/outputs/mapping/prodRelease/mapping.txt
          if-no-files-found: error
          retention-days: 30

      # Until 8.5 adds the Play service account, tags still build and
      # keep the artifact; the upload is skipped with a notice.
      - name: Write Play service account
        id: play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::notice::PLAY_SERVICE_ACCOUNT_JSON not set; Play upload skipped (8.5)"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play.json"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Set up Ruby
        if: steps.play.outputs.enabled == 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: android

      - name: Upload to Play internal track
        if: steps.play.outputs.enabled == 'true'
        run: bundle exec fastlane internal
        env:
          PLAY_JSON_KEY_PATH: ${{ runner.temp }}/play.json

      - name: Remove secrets
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" "$RUNNER_TEMP/play.json" keystore.properties

      - name: Build Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          REF_NAME: ${{ github.ref_name }}
          PLAY_UPLOAD: ${{ steps.play.outputs.enabled }}
        run: |
          {
            echo "### Release AAB $REF_NAME"
            echo ""
            echo "- **Status**: $JOB_STATUS"
            echo "- **Commit**: $GITHUB_SHA"
            echo "- **Play internal upload**: ${PLAY_UPLOAD:-false}"
          } >> "$GITHUB_STEP_SUMMARY"

  promote:
    name: Promote internal → closed
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # v* tags only; dispatching from a branch is refused by the environment.
    environment: release

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag must be on main
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ] || ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Run this from a v* tag on main."
            exit 1
          fi

      - name: Write Play service account
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON missing in the release environment"
            exit 1
          fi
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play.json"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: android

      - name: Promote
        run: bundle exec fastlane promote
        env:
          PLAY_JSON_KEY_PATH: ${{ runner.temp }}/play.json

      - name: Remove secrets
        if: always()
        run: rm -f "$RUNNER_TEMP/play.json"
