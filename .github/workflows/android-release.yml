name: Android Release

# Plan 8.2: a v* tag builds the signed, minified prod AAB. versionName
# and versionCode come from the tag (app/build.gradle.kts). Uploading it
# to Play is fastlane's job (8.3); here it is only an artifact.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Signed prod AAB
    runs-on: ubuntu-latest
    # Upload key secrets live only here; the environment allows v* tags only.
    environment: release

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-android-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-android-

      - name: Create google-services.json (prod)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p app/src/prod
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/src/prod/google-services.json

      # The keystore goes to the runner's temp dir; keystore.properties
      # must sit in android/ (read by app/build.gradle.kts). Both are
      # deleted in the last step.
      - name: Write upload key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::ANDROID_UPLOAD_* secrets missing in the release environment"
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build signed prod AAB
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >
          ./gradlew bundleProdRelease --stacktrace
          -Pgymbuddy.releaseTag="$RELEASE_TAG"
          -Pgymbuddy.uploadMapping=true

      - name: Upload AAB and mapping
        uses: actions/upload-artifact@v4
        with:
          name: app-prod-release-${{ github.ref_name }}
          path: |
            android/app/build/outputs/bundle/prodRelease/app-prod-release.aab
            android/app/build/outputs/mapping/prodRelease/mapping.txt
          if-no-files-found: error
          retention-days: 30

      - name: Remove upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" keystore.properties

      - name: Build Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          {
            echo "### Release AAB $REF_NAME"
            echo ""
            echo "- **Status**: $JOB_STATUS"
            echo "- **Commit**: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
