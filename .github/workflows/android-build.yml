name: Android Build

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
      - '.github/workflows/_gradle-test.yml'
      - '.github/workflows/_sonar.yml'
      - '.github/actions/coverage-exclusions/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
      - '.github/workflows/_gradle-test.yml'
      - '.github/workflows/_sonar.yml'
      - '.github/actions/coverage-exclusions/**'

jobs:
  exclusions:
    name: Resolve coverage exclusions
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.exclusions.outputs.android }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - id: exclusions
        uses: ./.github/actions/coverage-exclusions

  test:
    name: Test
    uses: ./.github/workflows/_gradle-test.yml
    with:
      module-path: android
      java-version: '17'
      # No plain `test` task on an Android application module - only
      # variant-specific ones.
      gradle-task: testDebugUnitTest jacocoTestReport
      coverage-report-dir: android/app/build/reports/jacoco/test
      secret-file-path: app/src/google-services.json
    secrets:
      secret-file-content: ${{ secrets.GOOGLE_SERVICES_JSON }}

  sonar:
    name: Sonar
    needs: [ test, exclusions ]
    uses: ./.github/workflows/_sonar.yml
    with:
      module-path: android
      sonar-project-key: rukavina-git_GymBuddy-android
      sources-path: app/src/main
      tests-path: app/src/test
      coverage-report-dir: android/app/build/reports/jacoco/test
      java-binaries-path: app/build/intermediates/built_in_kotlinc
      coverage-exclusions: ${{ needs.exclusions.outputs.android }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-apk:
    name: Build debug APK
    needs: test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-android-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-android-

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > app/src/google-services.json

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Build Summary
        if: always()
        run: |
          echo "### Build completed! :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
