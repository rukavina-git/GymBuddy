name: Android Build

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'android/**'
      # The app generates its API client from these at build time.
      - 'api/openapi.yaml'
      - 'api/kotlin-client-config.yaml'
      - '.github/workflows/android-build.yml'
      - '.github/workflows/_gradle-test.yml'
      - '.github/workflows/_sonar.yml'
      - '.github/actions/coverage-exclusions/**'
  # No paths filter: main's ruleset requires the android Test, Sonar and
  # APK checks, and a skipped workflow never reports them.
  pull_request:
    branches: [ main, develop ]

jobs:
  exclusions:
    name: Resolve coverage exclusions
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.exclusions.outputs.android }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - id: exclusions
        uses: ./.github/actions/coverage-exclusions

  test:
    name: Test
    uses: ./.github/workflows/_gradle-test.yml
    with:
      module-path: android
      java-version: '17'
      # No plain `test` task on an Android application module - only
      # variant-specific ones.
      # qa only: both flavors run the same code.
      gradle-task: testQaDebugUnitTest jacocoTestReport
      coverage-report-dir: android/app/build/reports/jacoco/test
      secret-file-path: app/src/qa/google-services.json
    secrets:
      secret-file-content: ${{ secrets.GOOGLE_SERVICES_JSON_QA }}

  sonar:
    name: Sonar
    needs: [ test, exclusions ]
    uses: ./.github/workflows/_sonar.yml
    with:
      module-path: android
      sonar-project-key: rukavina-git_GymBuddy-android
      sources-path: app/src/main
      tests-path: app/src/test
      coverage-report-dir: android/app/build/reports/jacoco/test
      java-binaries-path: app/build/intermediates/built_in_kotlinc
      coverage-exclusions: ${{ needs.exclusions.outputs.android }}
      # Free SonarCloud plan: the gate is readable on the main branch
      # only, so it blocks pushes to main; develop and PRs just report.
      wait-for-gate: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  lint:
    name: Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-android-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-android-

      - name: Create google-services.json (qa)
        env:
          GOOGLE_SERVICES_JSON_QA: ${{ secrets.GOOGLE_SERVICES_JSON_QA }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON_QA" > app/src/qa/google-services.json

      # Fails only on issues not in app/lint-baseline.xml (Plan 8.1).
      - name: Android Lint (qa debug)
        run: ./gradlew lintQaDebug --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            android/app/build/reports/lint-results-qaDebug.html
            android/app/build/reports/lint-results-qaDebug.sarif
          retention-days: 7

  build-apk:
    name: Build debug APK
    needs: test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-android-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-android-

      - name: Create google-services.json (qa + prod)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_QA: ${{ secrets.GOOGLE_SERVICES_JSON_QA }}
        run: |
          mkdir -p app/src/prod
          printf '%s' "$GOOGLE_SERVICES_JSON_QA" > app/src/qa/google-services.json
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/src/prod/google-services.json

      - name: Build debug APKs
        run: ./gradlew assembleQaDebug assembleProdDebug --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            android/app/build/outputs/apk/qa/debug/app-qa-debug.apk
            android/app/build/outputs/apk/prod/debug/app-prod-debug.apk
          retention-days: 7

      - name: Build Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          {
            echo "### Build completed! :rocket:"
            echo ""
            echo "- **Status**: $JOB_STATUS"
            echo "- **Branch**: $REF_NAME"
            echo "- **Commit**: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
