name: Android Testers

# Plan 8.3. Test stage: develop's qa app (test backend) to Firebase App
# Distribution, group "testers". Manual so testers aren't paged on
# every push. Environment `testers` allows develop only and holds only
# the qa signing key and the App Distribution account: nothing here can
# reach prod or Play (ADR 0017).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-testers
  cancel-in-progress: false

jobs:
  testers:
    name: qa APK to testers
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: testers

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Release notes are the last 10 commits.
          fetch-depth: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-android-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-android-

      - name: Create google-services.json (qa)
        env:
          GOOGLE_SERVICES_JSON_QA: ${{ secrets.GOOGLE_SERVICES_JSON_QA }}
        run: |
          mkdir -p app/src/qa
          printf '%s' "$GOOGLE_SERVICES_JSON_QA" > app/src/qa/google-services.json

      # Same mechanism as the release workflow, but the qa key: the Play
      # upload key never leaves the release environment.
      - name: Write qa signing key and App Distribution account
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_QA_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_QA_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_QA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_QA_KEY_PASSWORD }}
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_APP_DISTRIBUTION_SA_JSON }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$FIREBASE_SA_JSON" ]; then
            echo "::error::ANDROID_QA_* or FIREBASE_APP_DISTRIBUTION_SA_JSON missing in the testers environment"
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/qa.jks"
          {
            echo "storeFile=$RUNNER_TEMP/qa.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          printf '%s' "$FIREBASE_SA_JSON" > "$RUNNER_TEMP/firebase-sa.json"

      - name: Build qa release APK
        run: ./gradlew assembleQaRelease --stacktrace

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: android

      - name: Upload to App Distribution
        run: bundle exec fastlane test
        env:
          FIREBASE_APP_DISTRIBUTION_SA_PATH: ${{ runner.temp }}/firebase-sa.json

      - name: Remove secrets
        if: always()
        run: rm -f "$RUNNER_TEMP/qa.jks" "$RUNNER_TEMP/firebase-sa.json" keystore.properties

      - name: Build Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "### qa APK to testers"
            echo ""
            echo "- **Status**: $JOB_STATUS"
            echo "- **Commit**: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
