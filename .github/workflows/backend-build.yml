name: Backend Build

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-build.yml'
      - '.github/workflows/_gradle-test.yml'
      - '.github/workflows/_sonar.yml'
      - '.github/actions/coverage-exclusions/**'
  # No paths filter: main's ruleset requires the backend Test and Sonar
  # checks, and a skipped workflow never reports them.
  pull_request:
    branches: [ main ]

jobs:
  exclusions:
    name: Resolve coverage exclusions
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.exclusions.outputs.backend }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - id: exclusions
        uses: ./.github/actions/coverage-exclusions

  test:
    name: Test
    uses: ./.github/workflows/_gradle-test.yml
    with:
      module-path: backend
      java-version: '21'
      coverage-report-dir: backend/build/reports/jacoco/test

  sonar:
    name: Sonar
    needs: [ test, exclusions ]
    uses: ./.github/workflows/_sonar.yml
    with:
      module-path: backend
      sonar-project-key: rukavina-git_GymBuddy-backend
      coverage-report-dir: backend/build/reports/jacoco/test
      coverage-exclusions: ${{ needs.exclusions.outputs.backend }}
      # Free SonarCloud plan: only its main branch is readable, and that
      # is develop (ADR 0013, 8.2a). Develop pushes wait for the gate and
      # warn if red; main and PRs scan report-only (required checks).
      wait-for-gate: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
      # Seed migrations repeat INSERT shapes by design (generated data).
      cpd-exclusions: src/main/resources/db/migration/**
      # Seed SQL repeats literals ('DEFAULT', ids) by design, and applied
      # migrations can't change (Flyway checksums): skip S1192 there.
      # tools/ is a local one-shot generator: its paths are constants, so
      # S2083 (path from file content) is a false positive there.
      extra-args: >-
        -Dsonar.issue.ignore.multicriteria=e1,e2
        -Dsonar.issue.ignore.multicriteria.e1.ruleKey=plsql:S1192
        -Dsonar.issue.ignore.multicriteria.e1.resourceKey=src/main/resources/db/migration/**
        -Dsonar.issue.ignore.multicriteria.e2.ruleKey=pythonsecurity:S2083
        -Dsonar.issue.ignore.multicriteria.e2.resourceKey=tools/**
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Pushes the image the VPS runs (ADR 0016). develop pushes deploy it
  # to test (deploy-test below); prod deploys only from a v* tag on main
  # (backend-release.yml, ADR 0017). deploy.yml stays the manual path.
  image:
    name: Image to GHCR
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.sha_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Tags
        id: meta
        run: |
          image=ghcr.io/rukavina-git/gymbuddy-backend
          echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "$image:sha-${GITHUB_SHA::7}"
            echo "$image:$GITHUB_REF_NAME"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Plan 8.4: every develop push that builds an image deploys it to test.
  # Runs in environment test (develop allowed); main pushes don't deploy.
  deploy-test:
    name: Deploy test
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/deploy.yml
    with:
      target: test
      image_tag: ${{ needs.image.outputs.tag }}
