name: Backend Build

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-build.yml'
      - '.github/workflows/_gradle-test.yml'
      - '.github/workflows/_sonar.yml'
      - '.github/actions/coverage-exclusions/**'
  # No paths filter: main's ruleset requires the backend Test and Sonar
  # checks, and a skipped workflow never reports them.
  pull_request:
    branches: [ main ]

jobs:
  exclusions:
    name: Resolve coverage exclusions
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.exclusions.outputs.backend }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - id: exclusions
        uses: ./.github/actions/coverage-exclusions

  test:
    name: Test
    uses: ./.github/workflows/_gradle-test.yml
    with:
      module-path: backend
      java-version: '21'
      coverage-report-dir: backend/build/reports/jacoco/test

  sonar:
    name: Sonar
    needs: [ test, exclusions ]
    uses: ./.github/workflows/_sonar.yml
    with:
      module-path: backend
      sonar-project-key: rukavina-git_GymBuddy-backend
      coverage-report-dir: backend/build/reports/jacoco/test
      coverage-exclusions: ${{ needs.exclusions.outputs.backend }}
      # Seed migrations repeat INSERT shapes by design (generated data).
      cpd-exclusions: src/main/resources/db/migration/**
      # Seed SQL repeats literals ('DEFAULT', ids) by design, and applied
      # migrations can't change (Flyway checksums): skip S1192 there.
      extra-args: >-
        -Dsonar.issue.ignore.multicriteria=e1
        -Dsonar.issue.ignore.multicriteria.e1.ruleKey=plsql:S1192
        -Dsonar.issue.ignore.multicriteria.e1.resourceKey=src/main/resources/db/migration/**
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Pushes the image the VPS runs (ADR 0016). Deploying it is manual:
  # deploy.yml with one of these tags.
  image:
    name: Image to GHCR
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Tags
        id: meta
        run: |
          image=ghcr.io/rukavina-git/gymbuddy-backend
          {
            echo "tags<<EOF"
            echo "$image:sha-${GITHUB_SHA::7}"
            echo "$image:$GITHUB_REF_NAME"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
