name: Backend Build

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-build.yml'
      - '.github/workflows/_gradle-test.yml'
      - '.github/workflows/_sonar.yml'
      - '.github/actions/coverage-exclusions/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-build.yml'
      - '.github/workflows/_gradle-test.yml'
      - '.github/workflows/_sonar.yml'
      - '.github/actions/coverage-exclusions/**'

jobs:
  exclusions:
    name: Resolve coverage exclusions
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.exclusions.outputs.backend }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - id: exclusions
        uses: ./.github/actions/coverage-exclusions

  test:
    name: Test
    uses: ./.github/workflows/_gradle-test.yml
    with:
      module-path: backend
      java-version: '21'
      coverage-report-dir: backend/build/reports/jacoco/test

  sonar:
    name: Sonar
    needs: [ test, exclusions ]
    uses: ./.github/workflows/_sonar.yml
    with:
      module-path: backend
      sonar-project-key: rukavina-git_GymBuddy-backend
      coverage-report-dir: backend/build/reports/jacoco/test
      coverage-exclusions: ${{ needs.exclusions.outputs.backend }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
