name: OWASP Dependency Check

# Manual only. Two independent jobs, one per module, so a flagged
# vulnerability is attributable to backend or android at a glance rather
# than one combined report.

on:
  workflow_dispatch: {}

jobs:
  backend:
    name: Backend
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/_owasp.yml
    with:
      module-path: backend
      java-version: '21'
    secrets:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

  android:
    name: Android
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/_owasp.yml
    with:
      module-path: android
      java-version: '17'
      gradle-task: ':app:dependencyCheckAnalyze'
      report-dir: 'app/build/reports'
      secret-file-path: 'app/src/google-services.json'
    secrets:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      secret-file-content: ${{ secrets.GOOGLE_SERVICES_JSON }}
