name: OWASP Dependency Check

# Manual only. Two independent jobs, one per module, so a flagged
# vulnerability is attributable to backend or android at a glance rather
# than one combined report.

on:
  workflow_dispatch: {}

jobs:
  backend:
    name: Backend
    uses: ./.github/workflows/_owasp.yml
    with:
      module-path: backend

  android:
    name: Android
    uses: ./.github/workflows/_owasp.yml
    with:
      module-path: android
