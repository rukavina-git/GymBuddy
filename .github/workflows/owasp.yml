name: OWASP Dependency Check

# Two independent jobs, one per module, so a flagged vulnerability
# is attributable to backend or android at a glance rather than
# one combined report.

# Non-blocking (ADR 0013). Weekly + manual only: NVD's API returned
# 503 on every run (2026-11-15), so per-push vulnerability coverage
# comes from dependency-graph.yml (GitHub Advisory Database) instead.
on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch: {}

# A newer push makes an older scan of the same branch pointless.
concurrency:
  group: owasp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/_owasp.yml
    with:
      module-path: backend
      java-version: '21'
    secrets:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

  android:
    name: Android
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/_owasp.yml
    with:
      module-path: android
      java-version: '17'
      gradle-task: ':app:dependencyCheckAnalyze'
      report-dir: 'app/build/reports/dependency-check'
      secret-file-path: 'app/src/qa/google-services.json'
    secrets:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      secret-file-content: ${{ secrets.GOOGLE_SERVICES_JSON_QA }}
