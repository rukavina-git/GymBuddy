name: OWASP Dependency Check

# Runs on dependency changes (see paths below) or manually. Two
# independent jobs, one per module, so a flagged
# vulnerability is attributable to backend or android at a glance rather
# than one combined report.

on:
  workflow_dispatch: {}
  # The scan only reads the resolved dependency graph, so it only runs
  # when a file that can change that graph does.
  push:
    branches: [ main, develop ]
    paths:
      - '**/*.gradle.kts'
      - '**/libs.versions.toml'
      - '**/gradle-wrapper.properties'
      - '.github/workflows/owasp.yml'
      - '.github/workflows/_owasp.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '**/*.gradle.kts'
      - '**/libs.versions.toml'
      - '**/gradle-wrapper.properties'
      - '.github/workflows/owasp.yml'
      - '.github/workflows/_owasp.yml'

jobs:
  backend:
    name: Backend
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/_owasp.yml
    with:
      module-path: backend
      java-version: '21'
    secrets:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

  android:
    name: Android
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/_owasp.yml
    with:
      module-path: android
      java-version: '17'
      gradle-task: ':app:dependencyCheckAnalyze'
      report-dir: 'app/build/reports/dependency-check'
      secret-file-path: 'app/src/google-services.json'
    secrets:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      secret-file-content: ${{ secrets.GOOGLE_SERVICES_JSON }}
