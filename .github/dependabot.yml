# Version update PRs are OFF (open-pull-requests-limit: 0): the owner
# doesn't want Dependabot creating branches or commits. Bumps are done by
# hand on request. Security alerts stay on (repo settings); automatic
# security-fix PRs are off too. Set a limit > 0 to turn PRs back on;
# the groups below are kept for that.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /android
    target-branch: develop
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 0
    groups:
      android-minor:
        update-types: [minor, patch]

  - package-ecosystem: gradle
    directory: /backend
    target-branch: develop
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 0
    groups:
      backend-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /api
    target-branch: develop
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 0
    groups:
      api-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 0
    groups:
      actions:
        update-types: [minor, patch, major]
