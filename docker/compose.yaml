services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: gymbuddy
      POSTGRES_USER: gymbuddy
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local}
    ports:
      - "5432:5432"
    volumes:
      - gymbuddy-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U gymbuddy -d gymbuddy" ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
    ports:
      - "8080:8080"
    environment:
      # The only Postgres connection info the app is given - no
      # provider-specific host/port/db config anywhere else. Password is
      # separate (DB_PASSWORD below), matching application.yml, so it's
      # never embedded in this URL.
      DATABASE_URL: jdbc:postgresql://db:5432/gymbuddy?user=gymbuddy
      # Read from docker/.env (gitignored) - see docker/.env.example.
      DB_PASSWORD: ${DB_PASSWORD:-local}
      # Base64-encoded Firebase service account JSON - no key file on
      # disk anywhere. Must come from the calling shell's environment;
      # compose refuses to start with a clear message when it is unset.
      # See backend/README.md for how to supply it locally and in prod.
      FIREBASE_CREDENTIALS_B64: ${FIREBASE_CREDENTIALS_B64:?must be set}
    depends_on:
      db:
        condition: service_healthy

volumes:
  gymbuddy-db-data:
